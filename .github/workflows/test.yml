name: Test Suite

# 2026-11-12 CI 省時（ci-cost-trim）：
# - paths-ignore 只排除測試確定不讀的檔（.claude/skills、agent-dispatch 設定）；
#   CLAUDE.md、.claude/rules、scripts/qa-test-mode/README.md 有測試讀取，不可排除。
# - concurrency：同一 PR 新 push 取消舊 run；main push 不取消，每個 main SHA 都保留完整結果。
on:
  push:
    branches: [main]
    paths-ignore:
      - '.claude/skills/**'
      - '.claude/agent-dispatch.json'
  pull_request:
    branches: [main]
    paths-ignore:
      - '.claude/skills/**'
      - '.claude/agent-dispatch.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run check:registration-ops
      - run: npm run test:unit
      - run: npm run test:unit:coverage -- --coverageReporters=text-summary --coverageReporters=json-summary
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-coverage-summary
          path: coverage/coverage-summary.json
          if-no-files-found: warn

  firestore-rules-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: npm ci
      - run: npm install -g firebase-tools
      - run: npm run test:rules

  e2e-smoke-tests:
    # 積極版（2026-11-12）：PR 不跑 e2e（PR 多為 Functions／Rules 後端改動，舊站前端凍結），
    # main push 照跑；取代原本 PR 與 main push 都跑。
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04  # 2026-11-07：ubuntu-latest 已是 26.04，Playwright 1.59.1 不支援，釘 24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-webkit-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-chromium-webkit-
            ${{ runner.os }}-playwright-
      - run: npx playwright install --with-deps chromium webkit
        timeout-minutes: 10
      - run: |
          node tests/e2e/static-server.cjs 3000 &
          sleep 2
          BASE_URL=http://127.0.0.1:3000 npm run test:e2e:smoke -- --workers=1
          BASE_URL=http://127.0.0.1:3000 npx playwright test tests/e2e/home-layout-smoke.spec.js --project=webkit-mobile --workers=1
        timeout-minutes: 20
