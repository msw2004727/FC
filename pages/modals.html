<meta name="robots" content="noindex, nofollow">
<!-- ============ ATTENDANCE NOTIFY MODAL ============ -->
<div class="scan-result-overlay" id="attendance-notify-modal">
  <div class="scan-result-box success">
    <div class="scan-result-icon" id="att-notify-icon"></div>
    <div class="scan-result-title" id="att-notify-title"></div>
    <div class="scan-result-name" id="att-notify-event"></div>
    <button class="scan-result-close" onclick="App.closeAttendanceNotify()" data-i18n="確定">確定</button>
  </div>
</div>

<!-- ============ POPUP AD OVERLAY ============ -->
<div id="popup-ad-overlay" class="popup-ad-overlay" style="display:none" onclick="App.closePopupAd()">
  <div class="popup-ad-container" id="popup-ad-container" onclick="event.stopPropagation()">
    <div class="popup-ad-body" id="popup-ad-body"></div>
    <div class="popup-ad-footer">
      <span class="popup-ad-counter" id="popup-ad-counter"></span>
      <div class="popup-ad-footer-right">
        <button class="popup-ad-dismiss-btn" id="popup-ad-dismiss-btn" onclick="App.togglePopupDismiss()" data-i18n="點擊今日不再顯示">點擊今日不再顯示</button>
        <button class="popup-ad-close" onclick="App.closePopupAd()">✕</button>
      </div>
    </div>
  </div>
</div>

<!-- UID QR Code Popup -->
<div id="uid-qr-modal" style="display:none;position:fixed;inset:0;z-index:1200;background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);align-items:center;justify-content:center" onclick="if(event.target===this)App._closeUidQrModal()">
  <div style="background:var(--bg-card);border-radius:var(--radius-lg);max-width:320px;width:85%;padding:1.5rem;text-align:center;position:relative">
    <button style="position:absolute;top:.5rem;right:.7rem;background:none;border:none;font-size:1.2rem;cursor:pointer;color:var(--text-muted)" onclick="App._closeUidQrModal()">✕</button>
    <div id="uid-qr-content"></div>
  </div>
</div>

<!-- Custom Confirm Modal -->
<div class="app-confirm-overlay" id="app-confirm-modal">
  <div class="app-confirm-box">
    <div class="app-confirm-msg" id="app-confirm-msg"></div>
    <div class="app-confirm-btns">
      <button class="app-confirm-cancel" id="app-confirm-cancel" data-i18n="取消">取消</button>
      <button class="app-confirm-ok" id="app-confirm-ok" data-i18n="確定">確定</button>
    </div>
  </div>
</div>

<!-- ============ 自訂層級刪除確認彈窗 ============ -->
<div class="modal-overlay" id="role-delete-overlay" style="display:none;align-items:center;justify-content:center" onclick="if(event.target===this){this.style.display='none';this.classList.remove('open')}">
  <div class="modal" style="max-width:320px;position:static;border-radius:var(--radius);transform:none">
    <div class="modal-header">
      <h3 data-i18n="確認刪除層級">確認刪除層級</h3>
      <button class="modal-close" onclick="var o=document.getElementById('role-delete-overlay');o.style.display='none';o.classList.remove('open')">✕</button>
    </div>
    <div class="modal-body">
      <p id="role-delete-msg" style="font-size:.85rem;line-height:1.6"></p>
    </div>
    <div class="modal-actions">
      <button class="outline-btn" onclick="var o=document.getElementById('role-delete-overlay');o.style.display='none';o.classList.remove('open')" data-i18n="取消">取消</button>
      <button class="primary-btn" style="background:var(--danger)" id="role-delete-confirm-btn" data-i18n="確認刪除">確認刪除</button>
    </div>
  </div>
</div>

<!-- ============ 同行者新增/編輯 Modal ============ -->
<div class="modal-overlay" id="companion-modal-overlay" style="display:none;align-items:center;justify-content:center" onclick="if(event.target===this){App.closeCompanionModal()}">
  <div class="modal" style="max-width:340px;position:static;border-radius:var(--radius);transform:none">
    <div class="modal-header">
      <h3 id="companion-modal-title" data-i18n="新增同行者">新增同行者</h3>
      <button class="modal-close" onclick="App.closeCompanionModal()">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="companion-modal-id">
      <div style="margin-bottom:.6rem">
        <label style="font-size:.8rem;font-weight:600;display:block;margin-bottom:.3rem">姓名 <span style="color:var(--danger)">*</span></label>
        <input type="text" id="companion-modal-name" maxlength="20" placeholder="輸入姓名" style="width:100%;padding:.5rem .7rem;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-card);color:var(--text-primary);font-size:.85rem;box-sizing:border-box" data-i18n-placeholder="輸入姓名">
      </div>
      <div style="margin-bottom:.6rem">
        <label style="font-size:.8rem;font-weight:600;display:block;margin-bottom:.3rem" data-i18n="性別">性別</label>
        <select id="companion-modal-gender" style="width:100%;padding:.5rem .7rem;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-card);color:var(--text-primary);font-size:.85rem">
          <option value="" data-i18n="不填">不填</option>
          <option value="男" data-i18n="男">男</option>
          <option value="女" data-i18n="女">女</option>
        </select>
      </div>
      <div>
        <label style="font-size:.8rem;font-weight:600;display:block;margin-bottom:.3rem" data-i18n="備註">備註</label>
        <textarea id="companion-modal-notes" rows="2" maxlength="50" placeholder="例：家人、朋友（最多50字）" style="width:100%;padding:.5rem .7rem;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-card);color:var(--text-primary);font-size:.85rem;resize:none;box-sizing:border-box" data-i18n-placeholder="例：家人、朋友（最多50字）"></textarea>
      </div>
    </div>
    <div class="modal-actions">
      <button class="outline-btn" onclick="App.closeCompanionModal()" data-i18n="取消">取消</button>
      <button class="primary-btn" onclick="App.saveCompanion()" data-i18n="儲存">儲存</button>
    </div>
  </div>
</div>

<!-- first-login-modal 已內聯到 index.html（Plan B），此處不再重複 -->

<!-- ============ MODAL OVERLAY ============ -->
<!-- 2026-04-25：建立流程的 modal 加 data-no-backdrop-close="1"，避免誤觸關閉填到一半的表單 -->
<div class="modal-overlay" id="modal-overlay" onclick="App._handleModalBackdropClick(event)"></div>

<!-- ============ 同行者選擇報名 Modal ============ -->
<div class="modal-overlay" id="companion-select-overlay" style="display:none;align-items:center;justify-content:center" onclick="if(event.target===this){App._closeCompanionSelectModal()}">
  <div class="modal companion-select-modal" style="position:static;border-radius:var(--radius);transform:none">
    <div class="modal-header">
      <h3 data-i18n="選擇參與者">選擇參與者</h3>
      <button class="modal-close" onclick="App._closeCompanionSelectModal()">✕</button>
    </div>
    <div class="modal-body">
      <div id="companion-select-event-info" style="font-size:.8rem;color:var(--text-muted);margin-bottom:.7rem"></div>
      <div id="companion-select-list"></div>
      <div id="companion-select-summary" style="margin-top:.6rem;padding:.4rem .6rem;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:.78rem;background:var(--bg-elevated);display:flex;gap:.8rem;flex-wrap:wrap"></div>
    </div>
    <div class="modal-actions">
      <button class="outline-btn" onclick="App._closeCompanionSelectModal()" data-i18n="取消">取消</button>
      <button class="primary-btn" id="companion-select-confirm-btn" onclick="App._confirmCompanionRegister()" data-i18n="確認報名">確認報名</button>
    </div>
  </div>
</div>

<!-- ============ 同行者取消報名 Modal ============ -->
<div class="modal-overlay" id="companion-cancel-overlay" style="display:none;align-items:center;justify-content:center" onclick="if(event.target===this){App._closeCompanionCancelModal()}">
  <div class="modal" style="max-width:360px;position:static;border-radius:var(--radius);transform:none">
    <div class="modal-header">
      <h3 id="companion-cancel-title" data-i18n="取消報名">取消報名</h3>
      <button class="modal-close" onclick="App._closeCompanionCancelModal()">✕</button>
    </div>
    <div class="modal-body">
      <div style="font-size:.8rem;color:var(--text-muted);margin-bottom:.5rem" data-i18n="請選擇要取消的報名：">請選擇要取消的報名：</div>
      <div id="companion-cancel-warn" style="display:none;font-size:.78rem;color:var(--danger);padding:.3rem .5rem;border-radius:var(--radius-sm);background:rgba(239,68,68,.08);margin-bottom:.4rem"></div>
      <div style="margin-bottom:.4rem"><button class="outline-btn" style="font-size:.75rem;padding:.2rem .6rem" onclick="App._selectAllCancelRegs()" data-i18n="全選">全選</button></div>
      <div id="companion-cancel-list"></div>
    </div>
    <div class="modal-actions">
      <button class="outline-btn" onclick="App._closeCompanionCancelModal()" data-i18n="返回">返回</button>
      <button class="primary-btn" style="background:var(--danger)" onclick="App._confirmCompanionCancel()" data-i18n="確認取消">確認取消</button>
    </div>
  </div>
</div>

<!-- Confirm Modal -->
<div class="modal" id="confirm-modal">
  <div class="modal-header">
    <h3 id="confirm-title" data-i18n="確認操作">確認操作</h3>
    <button class="modal-close" onclick="App.closeModal()">✕</button>
  </div>
  <div class="modal-body" id="confirm-body"></div>
  <div class="modal-actions">
    <button class="outline-btn" onclick="App.closeModal()" data-i18n="取消">取消</button>
    <button class="primary-btn" onclick="App.closeModal()" data-i18n="確認">確認</button>
  </div>
</div>

<!-- 手機外部瀏覽器 LINE 登入提示 modal -->
<div class="modal" id="mobile-line-login-hint-modal" data-no-backdrop-close="1">
  <div class="modal-header">
    <h3 data-i18n="lineLoginHint.title">用 LINE 登入</h3>
    <button class="modal-close" type="button" onclick="App.closeModal()" aria-label="關閉" data-i18n-aria-label="common.close">✕</button>
  </div>
  <div class="modal-body line-login-hint-body">
    <p class="line-login-hint-intro" data-i18n="lineLoginHint.choose">選一種方式即可</p>
    <button class="primary-btn line-login-hint-action line-login-hint-primary" type="button" onclick="LineAuth._mobileHintContinue()" data-i18n="lineLoginHint.loginPage">前往 LINE 登入頁</button>
    <p class="line-login-hint-note" data-i18n="lineLoginHint.nextStep">下一頁選「使用 LINE 應用程式登入」</p>
    <div class="line-login-hint-or" data-i18n="lineLoginHint.or">或</div>
    <button class="outline-btn line-login-hint-action line-login-hint-secondary" type="button" onclick="LineAuth._copyAppUrlForLine()" data-i18n="lineLoginHint.copy">複製連結</button>
    <p class="line-login-hint-note" data-i18n="lineLoginHint.copyStep">貼到 LINE，點「前往」</p>
    <button class="line-login-hint-cancel" type="button" onclick="App.closeModal()" data-i18n="common.cancel">取消</button>
  </div>
</div>
